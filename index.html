---
layout: default
title: "Study Lock-In"
---
<script id="syllabi-data" type="application/json">
{{ site.data.syllabi | jsonify }}
</script>
<script id="activity-data" type="application/json">
{{ site.data.activity | jsonify }}
</script>
<script id="site-config" type="application/json">
{
  "baseurl": "{{ site.baseurl }}",
  "passcodeHash": "{{ site.passcode_hash }}"
}
</script>

<!-- Lock Screen Modal Overlay with Moving ASCII Art Background -->
<div id="lockScreen" class="lock-screen-overlay" style="display: none;">
  <canvas id="lockAsciiCanvas" class="lock-ascii-canvas" aria-hidden="true"></canvas>

  <div class="lock-card lock-minimal-card">
    <div class="lock-minimal-header">
      <pre class="lock-ascii-glyph" aria-hidden="true">
  .---.
 /_____\
 | .-. |
 | '-' |
 '-----'</pre>
      <h1 class="lock-minimal-title">Study // Lock-In</h1>
      <div class="lock-minimal-sub">Workspace Locked</div>
    </div>

    <form id="lockForm" class="lock-minimal-form" onsubmit="handleUnlock(event)">
      <div class="lock-minimal-input-row">
        <span class="lock-prompt-sym" aria-hidden="true">&gt;</span>
        <input 
          type="password" 
          id="passcodeInput" 
          class="lock-minimal-input" 
          placeholder="enter passcode..." 
          autocomplete="current-password" 
          autofocus 
          spellcheck="false"
        />
        <button type="button" class="lock-toggle-pwd lock-minimal-eye" onclick="togglePasscodeVisibility()" title="Show/Hide passcode">👁</button>
        <button type="submit" class="lock-minimal-submit" title="Unlock workspace (Enter)">↵</button>
      </div>
      <p id="lockError" class="lock-error-text"></p>
      <div class="lock-minimal-hint">
        <span>press <kbd>enter</kbd> to unlock</span>
        <span class="lock-hint-sep">·</span>
        <span>default: <code>lockin</code></span>
      </div>
    </form>
  </div>
</div>

<div class="app" id="app">
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <p class="loading-text">Loading tracker…</p>
  </div>
</div>
