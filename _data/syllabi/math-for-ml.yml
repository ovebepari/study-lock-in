    tasks:
    - text: 'Watch ''Matrix Calculus for Machine Learning'' by fast.ai (~30 min lecture).
        Focus on the key result: if loss L is a scalar and W is a matrix, then ∂L/∂W
        is a matrix of the SAME shape as W — where each entry (i,j) is ∂L/∂W_ij.'
      done: false
      comments: []
      resources:
      - label: 'fast.ai: Matrix Calculus for Deep Learning (lecture)'
        url: https://www.youtube.com/watch?v=5G7NkIQBFNk
