- title: 'Day 9: Derivatives from First Principles'
  subtitle: You know slope. A derivative is slope — but at a point, not a line. We
    build it from scratch
  label: Derivatives
  journal: ''
  time_logged: 0
  blocks:
  - title: Watch
    badge: morning
    icon: 📺
    tasks:
    - text: 'Watch 3B1B ''Essence of Calculus'' Ch.1 — The essence of calculus (~17
        min). The key insight: a derivative is the instantaneous rate of change —
        the slope of the curve AT a specific point. 3B1B builds it visually without
        needing any formulas first. The whole Essence of Calculus playlist is linked
        below.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Essence of Calculus Ch.1 — The essence of calculus'
        url: https://www.youtube.com/watch?v=WUvTyaaNkzM
      - label: '3B1B: Essence of Calculus (full playlist)'
        url: https://www.youtube.com/playlist?list=PLZHQObOWTQDMsr9K-rj53DwVRMYO3t5Yr
    - text: 'Watch 3B1B Essence of Calculus Ch.2 — The paradox of the derivative (~18
        min). The formal definition: f''(x) = lim[h→0] (f(x+h) - f(x)) / h. This is
        the slope of the tangent line. For neural nets, we ask: ''if I nudge this
        weight by a tiny amount h, how much does the loss change?'' That IS the derivative.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.2 — The paradox of the derivative'
        url: https://www.youtube.com/watch?v=9vKqVkMQHKk
  - title: Paper Exercises
    badge: afternoon
    icon: ✏️
    tasks:
    - text: 'Use the limit definition to find the derivative of f(x) = x² at x=3:
        f''(3) = lim[h→0] ((3+h)² - 3²) / h. Expand (3+h)² = 9 + 6h + h². So (9+6h+h²
        - 9)/h = (6h+h²)/h = 6+h → 6 as h→0. So f''(3) = 6. The slope of x² at x=3
        is 6. This same process, applied to a loss function, gives you the gradient.'
      done: false
      comments: []
    - text: 'Numerical check: Approximate the derivative of f(x)=x² at x=3 using h=0.001:
        (f(3.001)-f(3))/0.001 = (9.006001 - 9)/0.001 = 6.001. Close to 6! This numerical
        approximation trick is called finite differences — Karpathy uses exactly this
        to verify backpropagation implementations.'
      done: false
      comments: []
- title: 'Day 10: Derivative Rules — Power, Product, and Chain'
  subtitle: The chain rule is THE rule that makes backpropagation possible. Everything
    builds to this.
  label: Chain Rule
  journal: ''
  time_logged: 0
  blocks:
  - title: Watch
    badge: morning
    icon: 📺
    tasks:
    - text: 'Watch 3B1B Essence of Calculus Ch.3 — Derivative formulas through geometry
        (~18 min). Key rules to know: d/dx[xⁿ] = n·xⁿ⁻¹ (power rule). d/dx[sin(x)]
        = cos(x). d/dx[eˣ] = eˣ (e is its own derivative — remarkable!). d/dx[ln(x)]
        = 1/x. These show up constantly in ML.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.3 — Derivative formulas through geometry'
        url: https://www.youtube.com/watch?v=S0_qX4VJhMQ
    - text: 'Watch 3B1B Essence of Calculus Ch.4 — Visualizing the chain rule and
        product rule (~16 min). THE most important video for ML. Chain rule: if y
        = f(g(x)), then dy/dx = f''(g(x)) · g''(x). Neural networks are chains of
        functions. Backpropagation IS the chain rule applied repeatedly through the
        layers.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.4 — Visualizing the chain rule and product rule'
        url: https://www.youtube.com/watch?v=YG15m2VwSjA
  - title: Paper Exercises — Do Not Skip These
    badge: afternoon
    icon: ✏️
    tasks:
    - text: 'Power rule practice: find derivatives of (a) f(x)=x³, (b) f(x)=5x², (c)
        f(x)=x⁻¹, (d) f(x)=√x = x^(1/2). Answers: (a) 3x², (b) 10x, (c) -x⁻², (d)
        (1/2)x^(-1/2). Check yourself.'
      done: false
      comments: []
    - text: 'Chain rule practice — this is crucial: If f(x) = (3x+1)², what is f''(x)?
        Let u = 3x+1 (inner function), so f = u². Then f''(x) = df/du · du/dx = 2u
        · 3 = 6(3x+1). Try: g(x) = sin(x²). h(x) = e^(2x). Write out the inner and
        outer functions explicitly for each before differentiating.'
      done: false
      comments: []
    - text: 'Neural net chain rule preview: Suppose loss L = (output - target)², output
        = W·x + b, and W is a weight. What is dL/dW? By chain rule: dL/dW = dL/d(output)
        · d(output)/dW = 2(output-target) · x. This is the gradient of the loss with
        respect to the weight. This exact formula is what gradient descent uses to
        update W.'
      done: false
      comments: []
- title: 'Day 11: Partial Derivatives — When a Function Takes Many Inputs'
  subtitle: 'Neural networks have thousands of weights. Partial derivatives let us
    ask: how does the loss change if we tweak just ONE weight?'
  label: Partial Derivatives
  journal: ''
  time_logged: 0
  blocks:
