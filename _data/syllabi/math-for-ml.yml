    icon: ✏️
    tasks:
    - text: 'Compute sigmoid σ(x) for x ∈ {-3, -1, 0, 1, 3}: σ(x) = 1/(1+e^(-x)).
        Use a calculator for e. Plot these 5 points on paper. You should see the S-curve.
        Now compute the DERIVATIVE: σ''(x) = σ(x)·(1-σ(x)). Compute σ''(0) = 0.25,
        σ''(3) ≈ 0.045. Notice: the gradient of sigmoid near its extremes is near
        zero — this causes the vanishing gradient problem.'
      done: false
      comments: []
    - text: 'Connect to your trig knowledge: The tanh function tanh(x) = (e^x - e^(-x))/(e^x
        + e^(-x)) has the same S-curve shape as sigmoid but outputs (-1, 1) instead
        of (0, 1). Its derivative: tanh''(x) = 1 - tanh²(x). Compute tanh(0) = 0,
        tanh(1) ≈ 0.76. The tanh is a RESCALED sigmoid — literally tanh(x) = 2σ(2x)
        - 1.'
      done: false
      comments: []
