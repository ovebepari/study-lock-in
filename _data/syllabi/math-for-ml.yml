- title: 'Day 18: Backpropagation — The Chain Rule Applied to Your Network'
  subtitle: Backprop is just the chain rule applied layer-by-layer, in reverse. We
    trace how each weight contributed to the final error.
  label: Backpropagation
  journal: ''
  time_logged: 0
  blocks:
