      - text: "Worksheet — apply a matrix. By hand, on paper: (1) M=[[2, 0], [0, 3]]. Compute M·[1,1] and sketch before/after. (2) Rotation by 90°: R=[[0, -1], [1, 0]]. Compute R·[2,1]. (3) Shear S=[[1, 1], [0, 1]]. Compute S·[0,1] and S·[2,3]. (4) Write the matrix that reflects across the x-axis, and apply it to [3,4]. ✔ Check: (1) [2, 3]; (2) [-1, 2]; (3) [1, 1], [5, 3]; (4) [[1,0],[0,−1]] → [3,−4]"
        done: false
      - text: "Worksheet — build the matrix from where the basis goes. By hand, on paper: (1) A map sends î→[1,2] and ĵ→[3,−1]. Write it, then apply it to [2,1]. (2) Write the matrix that doubles x and leaves y alone. (3) Which matrix sends everything onto the x-axis (projection)? What is lost? ✔ Check: (1) [[1,3],[2,−1]] → [5, 3]; (2) [[2,0],[0,1]]; (3) [[1,0],[0,0]] — all y information is destroyed"
        done: false
      - text: "Reflect (journal): A neural-net layer computes W·x + b. Describe in words what W does to the input space, using today's picture."
        done: false
