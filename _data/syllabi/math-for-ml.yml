- title: 'Day 23: Numerical Stability and Floating Point Reality'
  subtitle: Real implementations differ from math class. Overflow, underflow, and
    log-sum-exp are practical concerns.
  label: Numerical Methods
  journal: ''
  time_logged: 0
  blocks:
  - title: Watch & Read
    badge: morning
    icon: 📺
    tasks:
    - text: 'Watch ''Numerical Stability of Neural Networks'' (search YouTube for
        a ~15 min explainer). Key issue: e^1000 overflows to infinity in floating
        point. Solution: the log-sum-exp trick. log(Σ e^(zᵢ)) = c + log(Σ e^(zᵢ-c))
        where c = max(z). Subtracting the max makes all values ≤0 before exponentiating
        — no overflow.'
      done: false
      comments: []
      resources:
      - label: 'Karpathy: Building micrograd (covers numerical stability in backprop)'
        url: https://www.youtube.com/watch?v=VMj-3S1tku0
      - label: 'CS231n: Neural Net Notes — Numerical Issues'
        url: https://cs231n.github.io/neural-networks-3/
    - text: 'Watch ''Numerical gradient checking'' — search for Karpathy or CS231n
        explanation (~10 min). To verify backprop is correct: for each weight w, compute
        (L(w+h) - L(w-h)) / (2h) numerically. Compare to the analytical gradient.
        If they match to ~6 decimal places, your backprop is likely correct. This
        is called a gradient check.'
      done: false
      comments: []
      resources:
      - label: 'CS231n: Gradient Checks (notes + code)'
        url: https://cs231n.github.io/neural-networks-3/#gradcheck
      - label: 'Karpathy: micrograd — gradient checking walkthrough'
        url: https://www.youtube.com/watch?v=VMj-3S1tku0&t=3900s
