    - text: 'Read about LoRA (Low-Rank Adaptation): it freezes a pretrained model''s
        weight matrices W and instead learns two small matrices A and B such that
        the update ΔW = A·B. Because rank(A·B) ≤ min(rank(A), rank(B)), this is a
        low-rank update — using exactly the linear algebra from Days 6–7. The math
        of fine-tuning billion-parameter models is the math you just learned.'
      done: false
