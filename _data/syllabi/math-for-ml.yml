        cycles and waves. Here''s the deep connection: tanh, sigmoid, and even ReLU
        are all ''squashing'' functions that bound outputs. In a neural net, sine
        waves appear in positional encodings (Transformers), Fourier features, and
        SIREN networks (which use sin as activation). The math of waves and the math
        of neural nets share the same root: periodic functions represented as combinations
        of sin/cos.'
      done: false
      comments: []
