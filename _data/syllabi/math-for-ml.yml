      - text: "Worksheet — linear combinations. By hand, on paper: (1) Find a, b with a·[1,2] + b·[2,1] = [4,5]. (2) Find a, b with a·[1,2] + b·[2,1] = [0,3]. (3) Is [3,6] in the span of [1,2] alone? Of [1,2] and [2,4]? (4) Do [1,2] and [2,1] span all of 2D? Justify in one sentence. ✔ Check: (1) a=2, b=1; (2) a=2, b=-1; (3) yes (3·[1,2]); still only that same line — [2,4] adds nothing; (4) yes — they are not parallel, so together they reach every point"
        done: false
