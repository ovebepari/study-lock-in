- title: 'Day 5: The Determinant — How Much Does a Transformation Scale Space?'
  subtitle: The determinant tells you if a transformation crushes, flips, or expands
    space — and whether it's reversible
  label: Determinant
  journal: ''
  time_logged: 0
  blocks:
  - title: Watch
    badge: morning
    icon: 📺
    tasks:
    - text: 'Watch 3B1B Essence of LA Ch.6 — The determinant (~10 min). Key idea:
        det(M) is the factor by which M scales areas (2D) or volumes (3D). det=0 means
        the transformation COLLAPSES space into a lower dimension — the matrix is
        singular (non-invertible). This matters in ML: a singular weight matrix means
        information is lost.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.6 — The determinant'
        url: https://www.youtube.com/watch?v=Ip3X9LOh2dk
  - title: Paper Exercises
    badge: afternoon
    icon: ✏️
    tasks:
    - text: 'Hand-compute det([[a,b],[c,d]]) = ad - bc. Try: det([[2,3],[1,4]]) =
        2·4 - 3·1 = 5. Try: det([[1,2],[2,4]]) — what does det=0 tell you about these
        two rows? (They''re linearly dependent — one is a multiple of the other.)'
      done: false
      comments: []
    - text: What is det(identity matrix) = det([[1,0],[0,1]])? What does that mean
        geometrically? What is det of a rotation matrix [[cos θ, -sin θ],[sin θ, cos
        θ]]? (Compute it — you'll find det=1 regardless of θ. Rotations preserve area.
        Satisfying, right?)
      done: false
      comments: []
  - title: Connect
    badge: evening
    icon: 🔗
    tasks:
    - text: 'Think about why a neural network''s weight matrix should NOT be initialized
        to all zeros or all the same value. Hint: what''s the determinant of a matrix
        where all rows are identical? What does that mean for information flow through
        that layer?'
      done: false
      comments: []
- title: 'Day 6: Inverse Matrices and What ''Solving'' Means'
  subtitle: The inverse undoes a transformation — when it exists. When it doesn't,
    you use approximations (like gradient descent)
  label: Inverse & Rank
  journal: ''
  time_logged: 0
  blocks:
  - title: Watch
    badge: morning
    icon: 📺
    tasks:
    - text: 'Watch 3B1B Essence of LA Ch.7 — Inverse matrices, column space, and null
        space (~12 min). The inverse A^-1 is the matrix that ''undoes'' A: A^-1·A
        = I (identity). Key point: the inverse only exists when det(A) ≠ 0. When no
        exact inverse exists, we approximate solutions — which is fundamentally what
        gradient descent does.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.7 — Inverse matrices, column space, null space'
        url: https://www.youtube.com/watch?v=uQhTuRlWMxw
  - title: Paper Exercises
    badge: afternoon
    icon: ✏️
    tasks:
    - text: 'Given A=[[2,1],[5,3]], verify that A^-1 = [[3,-1],[-5,2]] by computing
        A·A^-1. You should get the identity matrix [[1,0],[0,1]]. The formula for
        2x2 inverse: if A=[[a,b],[c,d]], then A^-1 = (1/det(A))·[[d,-b],[-c,a]].'
      done: false
      comments: []
    - text: What is the 'column space' of a matrix? It's the set of all possible outputs
        W·x as x ranges over all inputs. If your neural network's weight matrix has
        a small column space (low rank), it can only produce a limited variety of
        outputs — this is the concept behind LoRA (Low-Rank Adaptation), a popular
        technique for fine-tuning large models cheaply.
      done: false
      comments: []
  - title: Bonus Deep-Dive
    badge: evening
    icon: ⭐
    is_bonus: true
    tasks:
    - text: 'Watch 3B1B Essence of LA Ch.8 — Nonsquare matrices as transformations
        between dimensions (~5 min). Neural network layers are almost always nonsquare:
        a layer going from 784 inputs to 128 neurons uses a (128, 784) weight matrix.
        This maps from 784D space to 128D space.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.8 — Nonsquare matrices as transformations between dimensions'
        url: https://www.youtube.com/watch?v=bqJ_wEvWJWg
- title: 'Day 7: Eigenvalues & Eigenvectors — Vectors That Don''t Change Direction'
  subtitle: Hard to build intuition for at first, but essential for understanding
    PCA, attention, and optimization
  label: Eigenvalues
  journal: ''
  time_logged: 0
  blocks:
  - title: Watch
    badge: morning
    icon: 📺
    tasks:
    - text: Watch 3B1B Essence of LA Ch.14 — Eigenvectors and eigenvalues (~17 min).
        An eigenvector v of matrix A satisfies A·v = λ·v — the matrix only SCALES
        it by λ (the eigenvalue), never rotates it. These are the 'special directions'
        of a transformation. This is a harder concept — watch it twice if needed.
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.14 — Eigenvectors and eigenvalues'
        url: https://www.youtube.com/watch?v=PFDu9oVAE-g
    - text: 'Watch 3B1B Essence of LA Ch.15 — Abstract vector spaces (~16 min). Optional
        but mind-expanding: functions can be treated as vectors. This is why neural
        networks and Fourier analysis share the same underlying math.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.15 — Abstract vector spaces'
        url: https://www.youtube.com/watch?v=TgKwz5Ikpc8
      - label: 'StatQuest: PCA Eigenvectors (intuition for ML)'
        url: https://www.youtube.com/watch?v=fOpLdWYnmbY
  - title: Paper Exercises
    badge: afternoon
    icon: ✏️
    tasks:
    - text: 'Given A=[[2,1],[1,2]], verify that v=[1,1] is an eigenvector: compute
        A·[1,1] = [3,3] = 3·[1,1]. So λ=3. Now check v=[1,-1]: A·[1,-1] = [1,-1] =
        1·[1,-1]. So λ=1. These two eigenvectors are the ''natural axes'' of this
        transformation — it stretches along [1,1] by 3× and leaves [1,-1] unchanged.'
      done: false
      comments: []
  - title: Why This Matters for ML
    badge: evening
    icon: 🧠
    tasks:
    - text: 'Read (brief): Eigenvalues are behind PCA (Principal Component Analysis)
        — finding the ''most important directions'' in your data. They''re also behind
        why training very deep networks can be unstable: if the eigenvalues of the
        weight matrices are > 1, signals explode; if < 1, they vanish. This is literally
        the ''vanishing/exploding gradient problem'' in geometric terms.'
      done: false
      comments: []
- title: 'Day 8: Norms, Distances, and Measuring Vectors'
  subtitle: How do you measure the 'size' of a vector or matrix? This is the basis
    of loss functions and regularization
  label: Norms
  journal: ''
  time_logged: 0
  blocks:
  - title: Watch & Read
    badge: morning
    icon: 📺
    tasks:
    - text: Watch Khan Academy 'Vector norm' (~8 min). The L2 norm ||v|| = √(v₁² +
        v₂² + ... + vₙ²) is the Euclidean length. The L1 norm ||v||₁ = |v₁| + |v₂|
        + ... + |vₙ| is the sum of absolute values ('Manhattan distance'). Both appear
        constantly in ML loss functions and regularization.
      done: false
      comments: []
      resources:
      - label: 'Khan Academy: Vector norms'
        url: https://www.khanacademy.org/math/linear-algebra/vectors-and-spaces/magnitude-of-vectors/v/vector-magnitude
      - label: 'Khan Academy: Linear Algebra'
        url: https://www.khanacademy.org/math/linear-algebra
  - title: Paper Exercises
    badge: afternoon
    icon: ✏️
    tasks:
    - text: 'Compute L2 norm of v=[3,4]: ||v|| = √(9+16) = 5. Compute L1 norm: |3|+|4|
        = 7. For w=[-2, 1, 2]: L2 = ?, L1 = ?. Now compute the ''distance'' between
        two vectors a=[1,2] and b=[4,6]: ||a-b|| = ||[-3,-4]|| = 5. This is Euclidean
        distance — the same as the geometric distance formula from trig.'
      done: false
      comments: []
    - text: 'Loss function preview: Mean Squared Error (MSE) loss = (1/n)·Σ(predicted
        - actual)². This is essentially the squared L2 norm between your predictions
        and the truth, divided by n. Write out MSE for predictions=[3.0, 1.0] and
        actuals=[2.5, 1.5]. This is what gradient descent minimizes.'
      done: false
      comments: []
