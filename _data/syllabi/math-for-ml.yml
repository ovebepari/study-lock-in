        url: https://www.youtube.com/@wandb
  - title: Paper Exercise
    badge: afternoon
    icon: ✏️
    tasks:
    - text: 'Hand-simulate one step of SGD with momentum: gradient g=-0.86 (from Day
        18), momentum m=0, β=0.9, learning rate α=0.1. Step 1: m_new = 0.9·0 + 0.1·(-0.86)
        = -0.086. Step 2: w_new = w - α·m_new = 0.1 - 0.1·(-0.086) = 0.1086. Compare
        to vanilla GD: w_new = 0.1 - 0.1·(-0.86) = 0.186. Momentum takes a smaller
        step — it builds up gradually.'
      done: false
