    - text: Watch StatQuest 'Softmax Details' (~12 min). Softmax(z)ᵢ = e^(zᵢ) / Σⱼ
        e^(zⱼ). It converts a vector of raw scores (logits) into a probability distribution
        (all positive, sum to 1). It uses the exponential function — your earlier
        note that d/dx[eˣ]=eˣ makes the gradient computation elegant.
      done: false
