      - text: "Worksheet — vector arithmetic. By hand, on paper: (1) v=[2, 3], w=[-1, 2]: draw both, then v+w tip-to-tail. (2) Compute 2v − 3w. (3) Length ‖v‖ = √(v₁²+v₂²). (4) Unit vector v/‖v‖ (3 decimals) and check its length is 1. (5) Write [cos 30°, sin 30°] numerically; what is its length and why? ✔ Check: (1) [1, 5]; (2) [7, 0]; (3) √13 ≈ 3.606; (4) [0.555, 0.832]; (5) [0.866, 0.5]; length 1 — every point on the unit circle is a unit vector"
        done: false
      - text: "Worksheet — vectors as data. By hand, on paper: (1) A house is [rooms, m², age] = [3, 120, 10]. What does adding [0, 20, 0] mean? (2) Two houses a=[3,120,10], b=[4,150,2]: compute b − a and say what each entry means. (3) Why is ‖a − b‖ dominated by one coordinate here, and what would you do about it? ✔ Check: (1) an extension: +20 m², same rooms/age; (2) [1, 30, -8] — 1 more room, 30 m² more, 8 years newer; (3) m² is on a far larger scale; standardise features first (you'll do this in 'Initialisation & Normalisation')"
