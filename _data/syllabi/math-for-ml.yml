- title: 'Day 24: Optimization Beyond Gradient Descent — Momentum, Adam'
  subtitle: Raw gradient descent is slow. Modern optimizers add memory and adaptive
    learning rates. The math is a natural extension.
  label: Optimizers
  journal: ''
  time_logged: 0
  blocks:
  - title: Watch
    badge: morning
    icon: 📺
    tasks:
    - text: Watch 3B1B Essence of Calculus Ch.11 — Taylor series (~22 min). Understanding
        higher-order derivatives (second derivatives, curvature) is the mathematical
        basis for why momentum and Adam work better than vanilla gradient descent.
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.11 — Taylor series'
        url: https://www.youtube.com/watch?v=3d6DsjIBzJ4
    - text: 'Watch ''Adam Optimizer Explained'' by Weights & Biases or similar (~15
        min). Adam combines momentum (exponential moving average of gradients) with
        adaptive learning rates (per-parameter, based on squared gradients). The update
        rule: m = β₁·m + (1-β₁)·g, v = β₂·v + (1-β₂)·g², w_new = w - α·m̂/√(v̂+ε).
        Every symbol here is now understandable with your foundation.'
      done: false
      comments: []
      resources:
      - label: 'StatQuest: Stochastic Gradient Descent, Clearly Explained'
