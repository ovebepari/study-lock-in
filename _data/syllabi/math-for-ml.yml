      done: false
      comments: []
  - title: Key Result to Memorize
    badge: afternoon
    icon: ✏️
    tasks:
    - text: 'The most important matrix calculus result for neural nets: if z = W·x,
        then ∂L/∂W = ∂L/∂z · xᵀ (outer product), and ∂L/∂x = Wᵀ · ∂L/∂z. The TRANSPOSE
        of W appears when flowing gradients backward. This is why we computed W^T
        earlier — that''s what backpropagation uses.'
      done: false
      comments: []
    - text: 'Verify shapes: W is (m,n), x is (n,1), z is (m,1). ∂L/∂z is (m,1). Then
        ∂L/∂W = (m,1)·(1,n) = (m,n) ✓ — same shape as W. And ∂L/∂x = (n,m)·(m,1) =
        (n,1) ✓ — same shape as x. Write these shape checks out every time you do
        backprop. Shape errors are the #1 bug.'
      done: false
      comments: []
