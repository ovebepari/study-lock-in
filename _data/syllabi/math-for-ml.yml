- title: 'Day 2: Matrices as Transformations of Space'
  subtitle: 'The core mental model: a matrix doesn''t store numbers — it describes
    HOW to warp space'
  label: Matrices
  journal: ''
  time_logged: 0
  blocks:
  - title: Watch
    badge: morning
    icon: 📺
    tasks:
    - text: 'Watch 3B1B Essence of LA Ch.3 — Linear transformations and matrices (~11
        min). The key insight: a matrix transformation is FULLY described by where
        it sends the two basis vectors î=[1,0] and ĵ=[0,1]. Everything else follows
        from linearity.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.3 — Linear transformations and matrices'
        url: https://www.youtube.com/watch?v=kYB8JQd5Ctg
    - text: 'Watch 3B1B Essence of LA Ch.4 — Matrix multiplication as composition
        (~10 min). Two matrices multiplied = applying one transformation then another.
        This is HUGE for neural nets: each layer is a matrix transformation, and the
        whole network is composed transformations.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.4 — Matrix multiplication as composition'
        url: https://www.youtube.com/watch?v=XkY2DOUCWMU
  - title: Paper Exercises
    badge: afternoon
    icon: ✏️
    tasks:
    - text: 'Given matrix M = [[2,0],[0,3]], apply it to vector [1,1] by hand: M·v
        = [2·1+0·1, 0·1+3·1] = [2,3]. Now draw the original [1,1] and transformed
        [2,3] on paper. What did M do? (It stretched x by 2 and y by 3.) Apply M to
        [1,0] and [0,1]. Where do the basis vectors land?'
      done: false
      comments: []
    - text: 'Hand-compute this matrix multiplication: A=[[1,2],[3,4]], B=[[5,6],[7,8]].
        Compute A·B. Remember: (A·B)[row i, col j] = dot product of row i of A with
        column j of B. Then compute B·A. Are they equal? This non-commutativity is
        critical — layer order in a neural net MATTERS.'
      done: false
      comments: []
  - title: Connect to Neural Nets
    badge: evening
    icon: 🧠
    tasks:
    - text: 'Preview insight (read, don''t worry if fuzzy): In a neural net, one layer''s
        computation is literally: output = W·input + b, where W is a weight matrix
        and b is a bias vector. The matrix W is what you will eventually edit by hand.
        Everything you''re learning now is preparation for understanding exactly what
        happens when you change a single number in W.'
      done: false
      comments: []
- title: 'Day 3: The Dot Product — Similarity, Projection, and Why It''s Everywhere'
  subtitle: The dot product is the fundamental operation of neural nets, attention,
    and cosine similarity
  label: Dot Product
  journal: ''
  time_logged: 0
  blocks:
  - title: Watch
    badge: morning
    icon: 📺
    tasks:
    - text: 'Watch 3B1B Essence of LA Ch.9 — Dot products and duality (~13 min). Key
        idea: the dot product a·b = |a||b|cos(θ), where θ is the angle between them.
        This means: if two vectors point the same direction, dot product is large
        and positive. Opposite directions: large negative. Perpendicular: zero.'
      done: false
      comments: []
      resources:
      - label: '3B1B: Ch.9 — Dot products and duality'
        url: https://www.youtube.com/watch?v=LyGKzcYT2FM
    - text: Watch StatQuest 'Dot Products' (~12 min) for a complementary, ML-focused
        explanation. StatQuest is unusually clear at building from scratch.
      done: false
      comments: []
      resources:
      - label: 'StatQuest: Dot Products'
        url: https://www.youtube.com/watch?v=e0HAkOVBBP4
      - label: StatQuest YouTube channel
        url: https://www.youtube.com/@statquest
  - title: Paper Exercises
    badge: afternoon
    icon: ✏️
    tasks:
    - text: 'Hand-compute: a=[3,4], b=[1,2]. Dot product a·b = 3·1 + 4·2 = 11. Now
        compute |a| (length of a) = √(3²+4²) = 5. Compute |b| = √5. Use the formula
        a·b = |a||b|cos(θ) to find θ. Use a calculator for arccos — the goal is seeing
        the formula in action.'
      done: false
      comments: []
    - text: 'Neural net connection exercise: Imagine a neuron with weights w=[0.5,
        -0.3, 0.8] and input x=[1.0, 2.0, 0.5]. The neuron''s ''raw score'' is w·x
        = 0.5·1 + (-0.3)·2 + 0.8·0.5. Compute it. This dot product IS the core computation
        of a neuron. Everything else (activation function, bias) is built on top of
        this.'
      done: false
      comments: []
  - title: Geometric Intuition
    badge: evening
    icon: 🔗
    tasks:
    - text: 'Revisit your trig knowledge: cos(0°)=1, cos(90°)=0, cos(180°)=-1. The
        dot product formula a·b=|a||b|cos(θ) means the dot product literally MEASURES
        alignment between vectors. In ML, this is used everywhere: cosine similarity
        between word embeddings, attention scores in transformers, the neuron ''firing''
        based on how aligned its weights are with its input.'
      done: false
      comments: []
