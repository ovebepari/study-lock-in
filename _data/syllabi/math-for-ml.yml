        + 0.4·0.5 = 0.3. z1[1] = 0.2·1.0 + (-0.3)·0.5 = 0.05. So z1 = [0.3, 0.05].
        Step 2 — Apply ReLU: a1 = ReLU(z1) = [max(0,0.3), max(0,0.05)] = [0.3, 0.05].'
      done: false
      comments: []
    - text: 'Step 3 — Layer 2 pre-activation: z2 = W2·a1 + b2 = 0.5·0.3 + (-0.2)·0.05
        = 0.15 - 0.01 = 0.14. Output = 0.14. Step 4 — Loss: L = (output - target)²
